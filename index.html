let igT=[],igI=null;
function igMsg(n,t){const b=$('#igchat'),d=document.createElement('div');d.className='m';d.innerHTML=`<b>${E(n)}</b> ${E(t)}`;b.appendChild(d);while(b.children.length>5)b.firstChild.remove();setTimeout(()=>d.classList.add('fd'),6000);setTimeout(()=>d.remove(),7200)}

function igAccept(){
 go('igvideo');const v=$('#igv'),s=$('#igs');
 if(IG.video){v.src=IG.video;v.load()}if(IG.selfVideo){s.src=IG.selfVideo;s.load()}
 v.muted=false;const p=v.play();if(p)p.catch(()=>{v.muted=true;v.play().catch(()=>{})});
 s.muted=true;s.play().catch(()=>{});
 let sec=0;$('#igtm').textContent='00:00';igI=setInterval(()=>{sec++;$('#igtm').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000);
 let t=0;(IG.messages||[]).forEach(m=>{t+=(m.delay==null?3:m.delay)*1000;igT.push(setTimeout(()=>igMsg(m.from==='我'?U:IG.callerName,m.text),t))});
}
function igHang(){igT.forEach(clearTimeout);igT=[];clearInterval(igI);['#igv','#igs'].forEach(q=>{const e=$(q);e.pause();e.removeAttribute('src');e.load();e.muted=true});$('#igchat').innerHTML='';$('#pip').style.cssText='';go('igfeed')}

(()=>{const pip=$('#pip');let d=null;

let cur=-1,playing=false,pos=0,au=null,shuf=false,rep=false,drag=false;
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dur=()=>au&&isFinite(au.duration)&&au.duration?au.duration:(S[cur]&&S[cur].duration)||200;
function rSP(){
 $('#spList').innerHTML=S.map((x,i)=>`<div class="sr${i==cur?' pl':''}" onclick="load(${i})"><div class="si"><div class="st">${i==cur?`<span class="eq${playing?' go':''}"><i></i><i></i><i></i></span>`:''}${E(x.title)}</div><div class="sa">${E(x.artist)}</div></div><svg viewBox="0 0 24 24">${SI.mo}</svg></div>`).join('');
 const ic=playing?PAUSE:PLAY;['#bigp','#mP','#fP'].forEach(q=>$(q).innerHTML=ic);
 $('#sfa').style.stroke=$('#fSf').style.stroke=shuf?'#1db954':'';$('#fRp').style.stroke=rep?'#1db954':'';
 if(cur>=0){const s=S[cur];$('#mini').style.display='flex';$('#mT').textContent=$('#fT').textContent=s.title;$('#mA').textContent=$('#fA').textContent=s.artist;$('#fD').textContent=fmt(dur())}
}
function upd(){if(cur<0)return;const d=dur(),p=Math.min(100,pos/d*100);$('#mB').style.width=p+'%';$('#fC').textContent=fmt(pos);$('#fD').textContent=fmt(d);if(!drag){const r=$('#fSl');r.value=p*10;r.style.setProperty('--p',p+'%')}}
function load(i){if(au){au.pause();au=null}cur=i;pos=0;const s=S[i];if(s.audio){au=new Audio(s.audio);au.onended=next;au.onerror=()=>{au=null};au.onloadedmetadata=upd}play()}
function play(){playing=true;if(au)au.play().catch(()=>{});rSP();upd()}
function pause(){playing=false;if(au)au.pause();rSP()}
function toggle(){if(cur<0)load(0);else playing?pause():play()}
function next(){if(rep||S.length==1)load(cur);else load(shuf?Math.floor(Math.random()*S.length):(cur+1)%S.length)}
function prev(){if(pos>3){pos=0;if(au)au.currentTime=0;upd()}else load((cur-1+S.length)%S.length)}
function shufT(){shuf=!shuf;rSP()}function repT(){rep=!rep;rSP()}
function seekI(v){drag=true;pos=v/1000*dur();$('#fSl').style.setProperty('--p',v/10+'%');upd()}
function seekC(){if(au)au.currentTime=pos;drag=false}
setInterval(()=>{if(!playing||cur<0)return;if(au)pos=au.currentTime;else{pos+=.25;if(pos>=dur()){next();return}}upd()},250);

scr('cal',`${SB('#000')}<div class="sc"><div class="nav" style="color:#ff3b30"><span onclick="cmv(-1)">‹ 이전</span><span onclick="cmv(1)">다음 ›</span></div><div class="ttl" id="cTt"></div><div id="calb"></div></div>${HB('#000')}`,'lt');

 let h='<div class="cg7 wk">'+DAY.map(d=>`<div>${d}</div>`).join('')+'</div><div class="cg7">'+'<div></div>'.repeat(f);
 for(let d=1;d<=n;d++){const on=cy==now.getFullYear()&&cm==now.getMonth()&&d==now.getDate();h+=`<div class="cd${on?' td':''}" onclick="cd=${d};dayList()">${d}${(e[dkey(cy,cm,d)]||[]).length?'<i></i>':''}</div>`}
 $('#calb').innerHTML=h+'</div><div id="cdl"></div>';if(cd)dayList()}
function cmv(s){cm+=s;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}cd=null;rCal()}

function snap(){const v=$('#cmv');if(!v.videoWidth)return toast('카메라가 준비되지 않았어요');const c=document.createElement('canvas');c.width=Math.min(700,v.videoWidth);c.height=c.width*v.videoHeight/v.videoWidth;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);PHS.unshift(c.toDataURL('image/jpeg',.75));LS.s('ph',PHS.slice(0,12));toast('사진에 저장되었어요')}

/* ---- lock ---- */
scr('lock',`<div class="wp"></div>${SB('#fff')}<div class="lkd" id="lkd"></div><div class="lkt" id="lkt"></div>
<div class="lkb glass" style="left:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 2h8l-1 6 2 3v11H7V11l2-3z"/></svg></div>
<div class="lkb glass" style="right:44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.500" r="3.500"/></svg></div>
<div class="lkh">위로 쓸어 올려 잠금 해제</div><div class="hbw" style="color:#fff" onclick="unlock()"><i></i></div>`,'on');
document.querySelectorAll('.wp').forEach(w=>{if(WALL)w.style.backgroundImage=`url("${WALL}")`});
document.querySelector('#home').classList.add('on');
function unlock(){const l=$('#lock');l.style.transition='';l.style.transform='';askPass()}
(()=>{const l=$('#lock');let y0=null;
 l.addEventListener('pointerdown',e=>{y0=e.clientY;l.style.transition='none';l.setPointerCapture(e.pointerId)});
 l.addEventListener('pointermove',e=>{if(y0==null)return;l.style.transform=`translateY(${Math.min(0,e.clientY-y0)}px)`});
 l.addEventListener('pointerup',e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;l.style.transition='';if(dy<-90)unlock();else l.style.transform=''});})();
function tick(){const n=new Date(),t=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');document.querySelectorAll('.clk').forEach(e=>e.textContent=t);$('#lkt').textContent=t;$('#lkd').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 ${DAY[n.getDay()]}요일`}

/* ---- passcode ---- */
scr('pass',`<div class="wp" style="background-image:url('${WALL}')"></div><div style="position:absolute;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)"></div>${SB('#fff')}
<div style="position:absolute;top:calc(var(--top) + 40px);width:100%;text-align:center;color:#fff;font-size:19px;font-weight:600">암호 입력</div>
<div id="pdots" style="position:absolute;top:calc(var(--top) + 90px);width:100%;display:flex;justify-content:center;gap:18px"><i></i><i></i><i></i><i></i></div>
<div class="pg">${[1,2,3,4,5,6,7,8,9,'',0,''].map(d=>d===''?'<span></span>':`<div class="pk" onclick="pkey(${d})">${d}</div>`).join('')}</div>
<div style="position:absolute;bottom:calc(var(--bot) + 14px);left:0;right:0;display:flex;justify-content:space-between;padding:0 44px;color:#fff;font-size:17px"><span onclick="$('#pass').classList.remove('on')">취소</span><span onclick="pdel()">삭제</span></div>`);
$('#pass').style.zIndex=40;
let pin='';
function pdots(){document.querySelectorAll('#pdots i').forEach((e,k)=>e.classList.toggle('f',k<pin.length))}
function askPass(){pin='';pdots();$('#pass').classList.add('on')}
function pdel(){pin=pin.slice(0,-1);pdots()}
function pkey(d){if(pin.length>=4)return;pin+=d;pdots();if(pin.length==4)setTimeout(()=>{if(pin===String(CONFIG.passcode))okPass();else{const p=$('#pdots');p.classList.add('shk');setTimeout(()=>{p.classList.remove('shk');pin='';pdots()},450)}},120)}
function okPass(){const p=$('#pass'),l=$('#lock');p.classList.remove('on');l.style.transition='transform .32s ease';l.style.transform='translateY(-100%)';setTimeout(()=>{l.classList.remove('on');l.style.transform=''},330)}
</script>
